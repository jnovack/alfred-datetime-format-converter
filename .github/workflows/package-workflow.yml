name: GitHub Package

on:
  pull_request:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate_tag:
    runs-on: ubuntu-latest
    outputs:
      is_valid: ${{ steps.check.outputs.is_valid }}
    steps:
      - id: check
        name: Validate full semver tag
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" || "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            echo "is_valid=true" >> "${GITHUB_OUTPUT}"
          elif [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-((alpha|beta|pre|rc)([.-][0-9A-Za-z]+)*))?$ ]]; then
            echo "is_valid=true" >> "${GITHUB_OUTPUT}"
          else
            echo "is_valid=false" >> "${GITHUB_OUTPUT}"
            echo "Tag ${GITHUB_REF_NAME} is not a full semver tag like v1.3.0"
          fi

  github-package:
    runs-on: ubuntu-latest
    needs: validate_tag
    if: needs.validate_tag.outputs.is_valid == 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build .alfredworkflow package
        run: make build

      - name: Upload packaged workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DatetimeFormatConverter
          path: dist/DatetimeFormatConverter.alfredworkflow

      - name: Attach package to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DatetimeFormatConverter.alfredworkflow
